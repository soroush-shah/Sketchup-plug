<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banian Profile Builder</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" class="logo" aria-hidden="true"><path d="M5 25 L5 11 L11 7 L11 21 Z" fill="#1f6feb"/><path d="M13 25 L13 9 L19 5 L19 21 Z" fill="#2da44e"/><path d="M21 25 L21 13 L27 9 L27 21 Z" fill="#bf8700"/><rect x="3" y="25" width="26" height="3" rx="1" fill="#24292f"/></svg>
    <div>
      <div class="brand-name" data-i18n="app_name">Banian Profile Builder</div>
      <div class="brand-sub" data-i18n="app_sub"></div>
    </div>
  </div>
  <div class="top-actions">
    <select id="units" title="Units"></select>
    <button id="lang" class="chip"></button>
  </div>
</header>
<nav class="tabs" id="tabs"></nav>
<div id="banner" class="banner"></div>
<main id="main"></main>
<div id="toast" class="toast"></div>
<script src="i18n.js"></script>
<script src="panel.js"></script>
</body>
</html>
