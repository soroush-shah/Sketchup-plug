<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persian Text – متن فارسی</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <strong id="modeTitle">متن فارسی جدید <span class="en">New Persian Text</span></strong>
      <span id="backend" class="badge">…</span>
    </div>
    <div class="header-actions">
      <button id="btnPick" class="ghost" title="Edit the Persian text selected in the model">ویرایش متنِ انتخاب‌شده <span class="en">Edit selected</span></button>
    </div>
  </header>

  <main>
    <section class="controls">
      <!-- Text -->
      <div class="card">
        <label class="card-title" for="text">متن <span class="en">Text</span></label>
        <textarea id="text" rows="3" dir="auto" placeholder="متن خود را اینجا بنویسید… / Type your text here…"></textarea>
        <div class="row small">
          <label class="check"><input type="checkbox" id="persianDigits"> اعداد فارسی <span class="en">Persian digits</span></label>
          <label class="inline">جهت <span class="en">Direction</span>
            <select id="baseDir">
              <option value="auto">خودکار / Auto</option>
              <option value="rtl">راست‌به‌چپ / RTL</option>
              <option value="ltr">چپ‌به‌راست / LTR</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Font -->
      <div class="card">
        <div class="card-title">فونت <span class="en">Font</span></div>
        <div class="row">
          <input type="search" id="fontSearch" placeholder="جستجوی فونت / Search fonts…">
        </div>
        <div class="row small">
          <label class="check"><input type="checkbox" id="onlyPersian" checked> فقط فونت‌های فارسی <span class="en">Persian only</span></label>
          <label class="check"><input type="checkbox" id="showSamples" checked> نمونه‌ی متن <span class="en">Samples</span></label>
          <span id="fontCount" class="muted"></span>
        </div>
        <div id="fontList" class="font-list" tabindex="0"><div id="fontInner" class="font-inner"></div></div>
        <div class="row">
          <label class="inline grow">سبک <span class="en">Style</span>
            <select id="fontStyle"></select>
          </label>
          <button id="btnBrowse" class="ghost" title="Load a font file that is not installed (ttf/otf)">فایل فونت… <span class="en">File…</span></button>
          <button id="btnRescan" class="ghost icon" title="بازخوانی فونت‌ها / Rescan installed fonts">⟳</button>
        </div>
        <div id="axes"></div>
      </div>

      <!-- Size & layout -->
      <div class="card">
        <div class="card-title">اندازه و چیدمان <span class="en">Size &amp; layout</span></div>
        <div class="grid2">
          <label>ارتفاع <span class="en">Height</span>
            <span class="len"><input type="text" id="height" value="30" dir="ltr"><span class="unit"></span></span>
          </label>
          <label>معیار ارتفاع <span class="en">Height means</span>
            <select id="heightMode">
              <option value="em">اندازه‌ی فونت / Font size</option>
              <option value="ink">ارتفاع واقعی متن / Actual text height</option>
            </select>
          </label>
          <label>تراز <span class="en">Align</span>
            <span class="seg" id="alignSeg">
              <button data-v="right">راست<br><small>Right</small></button><button data-v="center">وسط<br><small>Center</small></button><button data-v="left">چپ<br><small>Left</small></button>
            </span>
          </label>
          <label>فاصله‌ی سطرها <span class="en">Line spacing</span> <output id="lineSpacingOut"></output>
            <input type="range" id="lineSpacing" min="0.8" max="3" step="0.05" value="1.6">
          </label>
          <label>فاصله‌ی کلمات <span class="en">Word spacing</span> <output id="wordSpacingOut"></output>
            <input type="range" id="wordSpacing" min="-20" max="150" step="1" value="0">
          </label>
          <label>فاصله‌ی حروف لاتین <span class="en">Latin letter spacing</span> <output id="letterSpacingOut"></output>
            <input type="range" id="letterSpacing" min="-10" max="60" step="1" value="0">
          </label>
        </div>
        <div class="hint">٪ = درصدی از اندازه‌ی فونت <span class="en">% = percent of font size</span></div>
      </div>

      <!-- Style -->
      <div class="card">
        <div class="card-title">ظاهر <span class="en">Appearance</span></div>
        <div class="grid2">
          <label>ضخیم/نازک‌کردن <span class="en">Bolder / thinner</span> <output id="boldOut"></output>
            <input type="range" id="bold" min="-4" max="10" step="0.25" value="0">
          </label>
          <label>کج (ایتالیک) <span class="en">Slant</span> <output id="slantOut"></output>
            <input type="range" id="slant" min="-25" max="25" step="1" value="0">
          </label>
          <label>شعاع قوس <span class="en">Arc radius</span>
            <span class="len"><input type="text" id="arc" value="0" dir="ltr" title="0 = flat. Positive: arch up, negative: arch down"><span class="unit"></span></span>
            <small class="muted">۰ یعنی صاف <span class="en">0 = straight</span></small>
          </label>
          <label>کیفیت منحنی‌ها <span class="en">Curve quality</span>
            <select id="quality">
              <option value="low">کم / Low</option>
              <option value="medium" selected>متوسط / Medium</option>
              <option value="high">زیاد / High</option>
            </select>
          </label>
        </div>
      </div>

      <!-- 3D -->
      <div class="card">
        <div class="card-title">سه‌بعدی و متریال <span class="en">3D &amp; material</span></div>
        <div class="grid2">
          <label>نوع <span class="en">Type</span>
            <span class="seg" id="filledSeg">
              <button data-v="1">سطح پر<br><small>Filled</small></button><button data-v="0">فقط خط دور<br><small>Outline</small></button>
            </span>
          </label>
          <label>ضخامت (اکسترود) <span class="en">Extrude depth</span>
            <span class="len"><input type="text" id="extrude" value="0" dir="ltr"><span class="unit"></span></span>
            <small class="muted">۰ یعنی تخت <span class="en">0 = flat</span></small>
          </label>
          <label>فاصله از سطح <span class="en">Offset from face</span>
            <span class="len"><input type="text" id="zOffset" value="0" dir="ltr" title="Lifts the text off the face it is glued to (avoids z-fighting)"><span class="unit"></span></span>
          </label>
          <label>متریال <span class="en">Material</span>
            <span class="row tight">
              <select id="material" class="grow"></select>
              <input type="color" id="color" value="#1f3a5f" title="رنگ دلخواه / Custom color">
            </span>
          </label>
        </div>
        <label class="check"><input type="checkbox" id="smooth" checked> نرم‌کردن لبه‌های کناری <span class="en">Smooth side edges</span></label>
        <div class="hint" id="unitHint"></div>
      </div>
    </section>

    <section class="preview-pane">
      <div class="preview-head">
        <span>پیش‌نمایش <span class="en">Preview</span></span>
        <span id="dims" class="muted"></span>
        <label class="check small"><input type="checkbox" id="livePreview" checked> زنده <span class="en">Live</span></label>
      </div>
      <div id="preview" class="preview"><div class="empty">…</div></div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <footer>
    <label class="check"><input type="checkbox" id="keepOpen"> پنجره باز بماند <span class="en">Keep open</span></label>
    <label class="check" id="editAllWrap" hidden><input type="checkbox" id="editAll"> اعمال روی همه‌ی کپی‌ها <span class="en">Apply to all copies</span></label>
    <span class="spacer"></span>
    <button id="btnCancel" class="ghost">بستن <span class="en">Close</span></button>
    <button id="btnBuild" class="primary" disabled>ساخت و قرار دادن <span class="en">Create &amp; place</span></button>
  </footer>
</div>

<script src="lib/clipper.js"></script>
<script src="lib/hb_wasm.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
